<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="二進位快打">
<meta name="theme-color" content="#0f1319">
<title>二進位快打</title>
<style>
  :root{
    --panel:#0f1319;        /* machined gunmetal base */
    --raise:#171d26;        /* raised surfaces */
    --recess:#20272f;       /* lamp OFF face */
    --edge:#2c3540;         /* bezels / hairlines */
    --lamp:#ffb020;         /* amber register lamp (the hero) */
    --lamp-hi:#ffd27a;      /* lamp highlight */
    --ink:#eef2f7;          /* primary text */
    --mute:#7c8a9a;         /* muted labels */
    --cool:#57d7e6;         /* target readout accent */
    --warn:#ff5a4d;         /* timer running out */
    --mono:ui-monospace,"SF Mono","Menlo","Consolas","Roboto Mono",monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:var(--panel)}
  body{
    font-family:var(--sans);color:var(--ink);
    background:
      radial-gradient(120% 90% at 50% -10%,#1a222d 0%,var(--panel) 55%,#0a0d12 100%);
    user-select:none;-webkit-user-select:none;touch-action:manipulation;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .screen{position:fixed;inset:0;display:flex;flex-direction:column;
    padding:calc(env(safe-area-inset-top) + 18px) 22px calc(env(safe-area-inset-bottom) + 18px);}
  .hidden{display:none!important}

  /* ---------- top gauges ---------- */
  .bar{display:flex;justify-content:space-between;align-items:center;gap:16px}
  .gauge{font-family:var(--mono);letter-spacing:.02em}
  .gauge .k{font-size:clamp(11px,1.6vw,14px);color:var(--mute);text-transform:uppercase;letter-spacing:.22em}
  .gauge .v{font-size:clamp(30px,6vw,52px);font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
  .gauge.small .v{font-size:clamp(18px,3.6vw,32px);color:var(--cool)}
  .barbtns{display:flex;gap:8px;align-items:center}
  #score .v{color:var(--lamp-hi)}
  #time.low .v{color:var(--warn)}
  #time.low{animation:blink 1s steps(2,start) infinite}
  @keyframes blink{50%{opacity:.55}}

  /* ---------- play field ---------- */
  .field{flex:1;display:flex;align-items:center;justify-content:center;gap:clamp(14px,4vw,64px);min-height:0;width:100%}

  /* five lamps */
  #lamps{display:flex;gap:clamp(8px,2vw,26px);align-items:stretch;flex:1 1 auto;min-width:0;justify-content:center;max-width:900px}
  .lamp{display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer;
    flex:1 1 0;min-width:0;max-width:150px}
  .bulb{width:100%;height:clamp(92px,30vh,220px);border-radius:18px;display:flex;align-items:center;justify-content:center;overflow:hidden;
    background:var(--recess);border:1px solid var(--edge);
    box-shadow:inset 0 3px 10px rgba(0,0,0,.55), inset 0 -1px 0 rgba(255,255,255,.04);
    transition:background .12s ease, box-shadow .12s ease, transform .08s ease;
    touch-action:none}
  .digit{font-family:var(--mono);font-weight:700;font-size:clamp(26px,8vw,80px);color:#485462;line-height:1}
  .place{font-family:var(--mono);font-size:clamp(13px,2.6vw,26px);color:var(--mute);letter-spacing:.05em}
  .lamp.on .bulb{
    background:linear-gradient(180deg,var(--lamp-hi),var(--lamp) 60%,#e08e00);
    border-color:#ffcf7a;
    box-shadow:0 0 34px rgba(255,176,32,.55), 0 0 8px rgba(255,176,32,.7),
               inset 0 2px 3px rgba(255,255,255,.55), inset 0 -6px 12px rgba(150,80,0,.4);}
  .lamp.on .digit{color:#241500}
  .lamp:active .bulb{transform:translateY(1px) scale(.985)}

  /* target */
  .target{display:flex;flex-direction:column;align-items:center;gap:8px;flex:0 0 auto}
  .target .k{font-family:var(--mono);font-size:clamp(11px,1.8vw,16px);color:var(--mute);
    text-transform:uppercase;letter-spacing:.26em}
  .target .num{font-family:var(--mono);font-weight:700;line-height:.9;color:var(--ink);
    font-size:clamp(64px,min(22vw,42vh),210px);font-variant-numeric:tabular-nums;
    display:inline-block;min-width:2ch;text-align:center;
    text-shadow:0 0 24px rgba(87,215,230,.25)}

  /* bottom readout + hint */
  .foot{display:flex;flex-direction:column;align-items:center;gap:6px;min-height:34px}
  #readout{font-family:var(--mono);font-size:clamp(15px,3vw,26px);color:var(--mute);letter-spacing:.14em}
  #readout b{color:var(--cool);font-weight:700}
  .tip{font-size:clamp(12px,2vw,15px);color:#5c6875}

  /* correct feedback — steady, no layout movement */
  .flashmark{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    font-family:var(--mono);font-weight:700;font-size:clamp(60px,16vw,160px);color:#5ee08a;
    pointer-events:none;opacity:0;text-shadow:0 0 30px rgba(94,224,138,.5)}
  .flashmark.go{animation:mark .42s ease}
  @keyframes mark{0%{opacity:0}30%{opacity:1}100%{opacity:0}}

  /* ---------- start / end overlays ---------- */
  .overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;justify-content:safe center;   /* tall content must stay reachable */
    gap:clamp(12px,2.6vh,26px);text-align:center;padding:clamp(18px,4vh,32px) 24px;
    overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
    background:radial-gradient(120% 90% at 50% 0%,#161d27,#0a0d12);z-index:5}
  .overlay>*{flex:0 0 auto}
  h1{margin:0;font-size:clamp(34px,8vw,72px);font-weight:800;letter-spacing:.04em}
  h1 .lit{color:var(--lamp);text-shadow:0 0 26px rgba(255,176,32,.5)}
  .lede{max-width:34ch;color:var(--mute);line-height:1.7;font-size:clamp(14px,2.4vw,19px);margin:0}
  .lede b{color:var(--ink)}
  .btn{font-family:var(--sans);font-size:clamp(18px,3.4vw,24px);font-weight:700;color:#241500;
    background:linear-gradient(180deg,var(--lamp-hi),var(--lamp));border:none;border-radius:16px;
    padding:clamp(12px,2.2vh,16px) 40px;cursor:pointer;box-shadow:0 0 30px rgba(255,176,32,.4);letter-spacing:.05em}
  .btn:active{transform:translateY(1px)}
  .btn:focus-visible{outline:3px solid var(--cool);outline-offset:3px}
  .toggle{display:inline-flex;align-items:center;gap:12px;color:var(--ink);font-size:clamp(14px,2.4vw,18px);cursor:pointer}
  .toggle input{width:22px;height:22px;accent-color:var(--lamp)}
  .final{font-family:var(--mono);font-size:clamp(20px,4vw,30px);color:var(--mute)}
  .final b{font-size:clamp(64px,16vw,120px);color:var(--lamp-hi);display:block;font-weight:700;line-height:1;margin:6px 0}

  /* end-screen stats */
  .stats{display:flex;gap:clamp(20px,7vw,64px);font-family:var(--mono)}
  .stats>div{display:flex;flex-direction:column;gap:6px}
  .sk{font-size:clamp(11px,1.8vw,14px);color:var(--mute);letter-spacing:.18em}
  .sv{font-size:clamp(20px,4.2vw,34px);color:var(--cool);font-weight:700;font-variant-numeric:tabular-nums}

  /* start-screen options */
  .opts{display:flex;flex-direction:column;gap:10px;align-items:center}
  .optrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center}
  .optk{font-size:clamp(12px,2.2vw,16px);color:var(--mute);letter-spacing:.1em}
  .modes.tiny .mode{font-size:clamp(12px,2.2vw,15px);padding:7px 14px}

  /* away (auto-reset break handling) */
  #field.away{opacity:.34}
  #awayNote{color:var(--lamp);letter-spacing:.05em;text-align:center}
  .toast{position:fixed;left:50%;top:13%;transform:translateX(-50%);z-index:7;opacity:0;
    font-family:var(--mono);font-weight:700;font-size:clamp(14px,2.6vw,20px);color:#241500;
    background:var(--lamp);border-radius:999px;padding:10px 22px;pointer-events:none;
    box-shadow:0 0 30px rgba(255,176,32,.45)}
  .toast.go{animation:toast 1.6s ease forwards}
  @keyframes toast{0%{opacity:0;transform:translate(-50%,-10px)}12%{opacity:1;transform:translate(-50%,0)}72%{opacity:1}100%{opacity:0}}

  /* pause + count-in */
  #cd{background:rgba(10,13,18,.93);gap:0;z-index:6}
  #cdNum{font-family:var(--mono);font-weight:700;line-height:1;color:var(--lamp);
    font-size:clamp(80px,24vw,200px);text-shadow:0 0 44px rgba(255,176,32,.45)}
  #cdNum.pop{animation:pop .45s ease}
  @keyframes pop{0%{transform:scale(.55);opacity:.15}45%{transform:scale(1);opacity:1}100%{transform:scale(1);opacity:1}}

  /* mode selector (segmented) */
  .modes{display:inline-flex;background:var(--raise);border:1px solid var(--edge);border-radius:14px;padding:4px;gap:4px}
  .mode{font-family:var(--sans);font-size:clamp(14px,2.4vw,18px);font-weight:700;color:var(--mute);
    background:transparent;border:none;border-radius:10px;padding:10px 20px;cursor:pointer}
  .mode.sel{background:var(--lamp);color:#241500}
  .mode:focus-visible{outline:2px solid var(--cool);outline-offset:2px}

  /* number picker */
  #practicePanel{display:flex;flex-direction:column;align-items:center;gap:clamp(8px,1.6vh,14px);max-width:520px;width:100%}
  #numGrid{display:grid;grid-template-columns:repeat(8,1fr);gap:clamp(5px,1vh,8px);width:100%}
  .chip{font-family:var(--mono);font-size:clamp(15px,2.6vw,20px);font-weight:700;color:var(--ink);
    background:var(--recess);border:1px solid var(--edge);border-radius:10px;padding:clamp(7px,1.3vh,10px) 0;cursor:pointer;
    font-variant-numeric:tabular-nums}
  .chip.sel{background:var(--lamp);border-color:#ffcf7a;color:#241500}
  .picktools{display:flex;gap:12px;align-items:center;color:var(--mute);font-size:clamp(13px,2.2vw,16px)}
  .link{background:none;border:none;color:var(--cool);font:inherit;cursor:pointer;text-decoration:underline}
  #pickCount b{color:var(--ink)}
  @media (max-width:420px){ #numGrid{grid-template-columns:repeat(6,1fr)} }

  /* in-game stop button (practice) */
  .mini{font-family:var(--sans);font-size:clamp(13px,2.4vw,17px);font-weight:700;color:var(--ink);
    background:var(--raise);border:1px solid var(--edge);border-radius:12px;padding:8px 18px;cursor:pointer}
  .mini:active{transform:translateY(1px)}

  .rotate{display:none}

  /* ---- portrait / narrow: stack target above the lamps ---- */
  @media (orientation:portrait), (max-width:600px){
    .field{flex-direction:column;gap:clamp(16px,4vh,40px)}
    .target{order:-1}
    .target .num{font-size:clamp(72px,20vw,180px)}
    #lamps{width:100%;max-width:none}
    .bulb{height:clamp(120px,24vh,240px)}
  }
  /* ---- short landscape (phone on its side): one row, fit to height ---- */
  @media (orientation:landscape) and (max-height:460px){
    .field{gap:clamp(12px,3vw,36px)}
    .bulb{height:min(46vh,180px)}
    .target .num{font-size:min(20vw,44vh)}
    .foot{min-height:0}
    #readout{font-size:clamp(13px,2.4vw,20px)}
  }

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>

  <!-- ===== START ===== -->
  <div class="overlay" id="start">
    <h1>二進位<span class="lit">快打</span></h1>
    <p class="lede">用手指把左邊五盞燈點亮，讓亮燈的位值 <b>16 8 4 2 1</b> 加起來等於目標數字。點對就自動換下一題。<br>每題都會計時，結束時看<b>平均一題幾秒</b>。</p>

    <div class="modes" role="tablist">
      <button class="mode sel" id="modeRandom">隨機挑戰</button>
      <button class="mode" id="modePractice">自選練習</button>
    </div>

    <div id="practicePanel" class="hidden">
      <div class="picktools">
        <span id="pickCount">已選 <b>0</b> 個</span>
        <button class="link" id="selAll">全選</button>
        <button class="link" id="selClear">清除</button>
      </div>
      <div id="numGrid"></div>
    </div>

    <label class="toggle"><input type="checkbox" id="hint" checked> 顯示目前數值（提示）</label>

    <div class="opts">
      <div class="optrow">
        <span class="optk">中斷處理</span>
        <div class="modes tiny" id="breakModes">
          <button class="mode sel" data-b="reset">自動重算</button>
          <button class="mode" data-b="pause">暫停繼續</button>
        </div>
      </div>
      <div class="optrow">
        <span class="optk">離開判定</span>
        <div class="modes tiny" id="idleOpts">
          <button class="mode" data-s="5">5 秒</button>
          <button class="mode sel" data-s="8">8 秒</button>
          <button class="mode" data-s="12">12 秒</button>
        </div>
      </div>
      <p class="tip" id="breakTip"></p>
    </div>

    <button class="btn" id="startBtn">開始（60 秒）</button>
  </div>

  <!-- ===== GAME ===== -->
  <div class="screen hidden" id="game">
    <div class="bar">
      <div class="gauge" id="time"><div class="k">時間</div><div class="v" id="timeV">60</div></div>
      <div class="gauge small" id="avg"><div class="k">平均</div><div class="v" id="avgV">–</div></div>
      <div class="barbtns">
        <button class="mini" id="pauseBtn">暫停</button>
        <button class="mini hidden" id="stopBtn">結束</button>
      </div>
      <div class="gauge" id="score" style="text-align:right"><div class="k">答對</div><div class="v" id="scoreV">0</div></div>
    </div>

    <div class="field" id="field">
      <div id="lamps">
        <div class="lamp" data-i="0"><div class="bulb"><span class="digit">0</span></div><div class="place">16</div></div>
        <div class="lamp" data-i="1"><div class="bulb"><span class="digit">0</span></div><div class="place">8</div></div>
        <div class="lamp" data-i="2"><div class="bulb"><span class="digit">0</span></div><div class="place">4</div></div>
        <div class="lamp" data-i="3"><div class="bulb"><span class="digit">0</span></div><div class="place">2</div></div>
        <div class="lamp" data-i="4"><div class="bulb"><span class="digit">0</span></div><div class="place">1</div></div>
      </div>
      <div class="target">
        <div class="k">目標</div>
        <div class="num" id="targetV">–</div>
      </div>
    </div>

    <div class="foot">
      <div id="readout">目前 <span class="bin">00000</span> ＝ <b class="dec">0</b></div>
      <div class="tip hidden" id="awayNote"></div>
    </div>
  </div>
  <div class="flashmark" id="mark">✓</div>
  <div class="toast" id="toast">平均重新計算</div>

  <!-- ===== PAUSE ===== -->
  <div class="overlay hidden" id="pause">
    <h1>已<span class="lit">暫停</span></h1>
    <p class="lede" id="pauseWhy">暫停中。</p>
    <p class="lede">按「繼續」會倒數 <b>3 秒</b>再開始，<b>這一題不列入平均</b>。</p>
    <button class="btn" id="resumeBtn">繼續</button>
    <button class="link" id="quitBtn">結束這局</button>
  </div>

  <!-- ===== COUNT-IN ===== -->
  <div class="overlay hidden" id="cd"><div id="cdNum">3</div></div>

  <!-- ===== END ===== -->
  <div class="overlay hidden" id="end">
    <h1 id="endTitle">時間到</h1>
    <div class="final">你答對了<b id="finalV">0</b>題</div>
    <div class="stats">
      <div><span class="sk">平均每題</span><span class="sv" id="statAvg">–</span></div>
      <div><span class="sk">最快</span><span class="sv" id="statBest">–</span></div>
      <div><span class="sk">計時題數</span><span class="sv" id="statN">0</span></div>
    </div>
    <button class="btn" id="againBtn">再玩一次</button>
  </div>

<script>
(() => {
  const PLACE = [16,8,4,2,1];
  const $ = s => document.querySelector(s);
  const lampEls = [...document.querySelectorAll('.lamp')];
  const digitEls = lampEls.map(l => l.querySelector('.digit'));
  const field   = $('#field');
  const readout = $('#readout');
  const binEl   = readout.querySelector('.bin');
  const decEl   = readout.querySelector('.dec');
  const targetV = $('#targetV');
  const timeEl  = $('#time'), timeV = $('#timeV');
  const scoreV  = $('#scoreV');
  const mark    = $('#mark');

  let bits, target, score, timeLeft, running=false, locked=false, showHint=true, prev=0, tid=null, ac=null;
  let mode='random', pool=[], selected=new Set();
  const timedTotal=60;

  // per-question stopwatch
  let times=[], qStart=0, qAcc=0, qOn=false, qCounted=true;
  let paused=false, away=false, idleTid=null, cdTid=null, toastTid=null;
  // how a break is handled: 'reset' = go away, come back, average starts over
  //                         'pause' = pause screen + 3-2-1 count-in, that question dropped
  let breakMode='reset', idleMs=8000;

  const value = () => bits.reduce((a,b,i)=>a+b*PLACE[i],0);

  function render(){
    bits.forEach((b,i)=>{ lampEls[i].classList.toggle('on', !!b); digitEls[i].textContent = b; });
    binEl.textContent = bits.join('');
    decEl.textContent = value();
    readout.style.visibility = showHint ? 'visible' : 'hidden';
  }

  function nextTarget(){
    let t;
    if (pool.length <= 1) { t = pool[0]; }
    else { do { t = pool[Math.floor(Math.random()*pool.length)]; } while (t === prev); }
    prev = t; target = t; targetV.textContent = t;
  }

  // ---- per-question stopwatch ----
  function qBegin(){ qAcc=0; qStart=performance.now(); qOn=true; qCounted=true; armIdle(); }
  function qHold(){ if(qOn){ qAcc += performance.now()-qStart; qOn=false; } clearTimeout(idleTid); }
  function qSecs(){ return (qAcc + (qOn ? performance.now()-qStart : 0)) / 1000; }
  function armIdle(){
    clearTimeout(idleTid);
    if (!running || paused || away) return;
    // 'pause' mode only auto-pauses in practice — the timed round already has a clock
    if (breakMode === 'pause' && mode !== 'practice') return;
    idleTid = setTimeout(()=>leave('idle'), idleMs);
  }
  // one entry point for "the player is no longer here"
  function leave(why){
    if (breakMode === 'pause'){ cancelCountIn(); pauseGame(why); }
    else goAway(why);
  }
  const avgSecs = () => times.length ? times.reduce((a,b)=>a+b,0)/times.length : null;
  function showAvg(){ const a=avgSecs(); $('#avgV').textContent = a==null ? '–' : a.toFixed(1)+'s'; }

  function toggle(indices){
    if (locked || !running || paused) return;
    if (away) comeBack();          // the tap that wakes it also counts as a normal tap
    armIdle();
    indices.forEach(i => bits[i] ^= 1);
    render();
    if (value() === target) correct();
  }

  function correct(){
    locked = true;
    if (qCounted) times.push(qSecs());
    qHold();
    score++; scoreV.textContent = score; showAvg();
    field.classList.add('correct');
    mark.classList.add('go');
    beep(); try{ navigator.vibrate && navigator.vibrate(30); }catch(e){}
    setTimeout(()=>{
      field.classList.remove('correct'); mark.classList.remove('go');
      bits = [0,0,0,0,0];
      nextTarget(); render();
      locked = false;
      if (running && !paused) qBegin();
    }, 420);
  }

  // ---- break handling A: away / auto-reset (no buttons) ----
  function goAway(why){
    if (!running || away || paused) return;
    away = true; qHold();
    clearInterval(tid); tid = null;                  // the clock waits for you
    field.classList.add('away');
    const note = $('#awayNote');
    note.textContent = (why === 'away' ? '偵測到你離開了' : '停下來超過 ' + (idleMs/1000) + ' 秒')
                     + ' · 點任一盞燈繼續，平均會重新計算';
    note.classList.remove('hidden');
  }

  function comeBack(){
    away = false;
    $('#awayNote').classList.add('hidden');
    field.classList.remove('away');
    times = []; showAvg();                            // fresh average for this new sitting
    qCounted = false;                                 // this half-done question doesn't count
    qAcc = 0; qStart = performance.now(); qOn = true;
    if (mode === 'random' && !tid) tid = setInterval(tick, 1000);
    toast('平均重新計算');
  }

  function toast(msg){
    const t = $('#toast');
    t.textContent = msg;
    t.classList.remove('go'); void t.offsetWidth; t.classList.add('go');
    clearTimeout(toastTid); toastTid = setTimeout(()=>t.classList.remove('go'), 1700);
  }

  // ---- break handling B: pause / resume ----
  function pauseGame(why){
    if (!running || paused) return;
    paused = true; qCounted = false;          // this question no longer counts
    qHold(); clearInterval(tid);
    $('#pauseWhy').textContent =
      why === 'idle' ? '超過 ' + (idleMs/1000) + ' 秒沒有動作，已自動暫停。' :
      why === 'away' ? '你切換到別的畫面，已自動暫停。' :
                       '休息一下，計時已停住。';
    $('#pause').classList.remove('hidden');
  }

  function resumeGame(){
    if (!paused) return;
    $('#pause').classList.add('hidden');
    countIn(3, ()=>{
      paused = false;
      qAcc = 0; qStart = performance.now(); qOn = true;   // re-time from here, but not counted
      armIdle();
      if (mode === 'random'){ clearInterval(tid); tid = setInterval(tick, 1000); }
    });
  }

  function countIn(n, done){
    const cd = $('#cd'), num = $('#cdNum');
    let k = n;
    const paint = txt => { num.textContent = txt; num.classList.remove('pop'); void num.offsetWidth; num.classList.add('pop'); };
    cd.classList.remove('hidden'); paint(k);
    clearInterval(cdTid);
    cdTid = setInterval(()=>{
      k--;
      if (k > 0){ paint(k); return; }
      clearInterval(cdTid); paint('開始');
      cdTid = setTimeout(()=>{ cdTid = null; cd.classList.add('hidden'); done(); }, 350);
    }, 700);
  }
  // interrupted mid-count-in: drop back to the pause screen
  function cancelCountIn(){
    if (!cdTid) return;
    clearInterval(cdTid); clearTimeout(cdTid); cdTid = null;
    $('#cd').classList.add('hidden');
    if (paused) $('#pause').classList.remove('hidden');
  }

  function tick(){
    timeLeft--; timeV.textContent = timeLeft;
    timeEl.classList.toggle('low', timeLeft <= 10);
    if (timeLeft <= 0) endGame();
  }

  function startGame(){
    showHint = $('#hint').checked;
    if (mode === 'practice') {
      pool = [...selected].sort((a,b)=>a-b);
      if (pool.length === 0) return;
    } else {
      pool = Array.from({length:31}, (_,i)=>i+1);
    }
    const timed = (mode === 'random');
    bits = [0,0,0,0,0]; score = 0; prev = 0; timeLeft = timedTotal;
    times = []; showAvg();
    scoreV.textContent = 0; timeV.textContent = timedTotal; timeEl.classList.remove('low');
    timeEl.classList.toggle('hidden', !timed);       // no clock in practice
    $('#stopBtn').classList.remove('hidden');
    $('#pauseBtn').classList.toggle('hidden', breakMode !== 'pause');
    $('#awayNote').classList.add('hidden'); field.classList.remove('away');
    nextTarget(); render();
    $('#start').classList.add('hidden'); $('#end').classList.add('hidden'); $('#pause').classList.add('hidden');
    $('#game').classList.remove('hidden');
    running = true; locked = false; paused = false; away = false;
    clearInterval(tid); clearInterval(cdTid);
    if (timed) tid = setInterval(tick, 1000);
    qBegin();
    initAudio();
  }

  function endGame(){
    clearInterval(tid); clearInterval(cdTid); clearTimeout(idleTid);
    running = false; paused = false; away = false; qHold();
    field.classList.remove('away'); $('#awayNote').classList.add('hidden');
    const a = avgSecs();
    $('#endTitle').textContent = (mode === 'practice') ? '練習結束' : (timeLeft > 0 ? '結束' : '時間到');
    $('#finalV').textContent = score;
    $('#statAvg').textContent  = a == null ? '–' : a.toFixed(1) + ' 秒';
    $('#statBest').textContent = times.length ? Math.min(...times).toFixed(1) + ' 秒' : '–';
    $('#statN').textContent    = times.length;
    $('#game').classList.add('hidden'); $('#pause').classList.add('hidden'); $('#cd').classList.add('hidden');
    $('#end').classList.remove('hidden');
  }

  // ---- input: multi-touch ----
  const lampRow = $('#lamps');
  lampRow.addEventListener('touchstart', e => {
    e.preventDefault();
    const idx = new Set();
    for (const t of e.changedTouches){
      const el = document.elementFromPoint(t.clientX, t.clientY);
      const lamp = el && el.closest && el.closest('.lamp');
      if (lamp) idx.add(+lamp.dataset.i);
    }
    if (idx.size) toggle(idx);
  }, {passive:false});

  // ---- input: mouse (desktop) ----
  lampEls.forEach(l => l.addEventListener('click', () => {
    if ('ontouchstart' in window) return;   // avoid double on touch devices
    toggle(new Set([+l.dataset.i]));
  }));

  // ---- input: keys 1–5 (desktop testing) ----
  window.addEventListener('keydown', e => {
    if (!running) return;
    if (breakMode === 'pause' && (e.key === 'Escape' || e.key === 'p' || e.key === 'P')){
      paused ? resumeGame() : pauseGame('manual');
      return;
    }
    if (paused) return;
    const n = '12345'.indexOf(e.key);
    if (n >= 0) toggle(new Set([n]));
  });

  // switching apps / locking the phone counts as leaving, whichever break mode is on
  document.addEventListener('visibilitychange', ()=>{ if (document.hidden) leave('away'); });
  window.addEventListener('blur', ()=>leave('away'));

  // block iOS pinch / double-tap zoom on the play area
  document.addEventListener('gesturestart', e => e.preventDefault());

  // ---- tiny "correct" blip ----
  function initAudio(){ try{ ac = ac || new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==='suspended') ac.resume(); }catch(e){} }
  function beep(){
    if(!ac) return;
    try{
      const o = ac.createOscillator(), g = ac.createGain();
      o.type='square'; o.frequency.value=880;
      o.connect(g); g.connect(ac.destination);
      const t = ac.currentTime;
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.12,t+0.01);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.14);
      o.frequency.setValueAtTime(660,t); o.frequency.setValueAtTime(990,t+0.07);
      o.start(t); o.stop(t+0.15);
    }catch(e){}
  }

  // ---- mode selector + number picker ----
  const grid = $('#numGrid');
  for (let n=1;n<=31;n++){
    const b=document.createElement('button');
    b.className='chip'; b.textContent=n; b.dataset.n=n;
    b.addEventListener('click',()=>{
      if(selected.has(n)){ selected.delete(n); b.classList.remove('sel'); }
      else { selected.add(n); b.classList.add('sel'); }
      updatePick();
    });
    grid.appendChild(b);
  }
  const allNums = () => Array.from({length:31},(_,i)=>i+1);
  function updatePick(){ $('#pickCount').innerHTML = '已選 <b>'+selected.size+'</b> 個'; updateStartBtn(); }
  $('#selAll').addEventListener('click',()=>{ selected=new Set(allNums()); [...grid.children].forEach(c=>c.classList.add('sel')); updatePick(); });
  $('#selClear').addEventListener('click',()=>{ selected.clear(); [...grid.children].forEach(c=>c.classList.remove('sel')); updatePick(); });

  function setMode(m){
    mode=m;
    $('#modeRandom').classList.toggle('sel', m==='random');
    $('#modePractice').classList.toggle('sel', m==='practice');
    $('#practicePanel').classList.toggle('hidden', m!=='practice');
    updateStartBtn(); saveOpts();
  }
  function updateStartBtn(){
    const btn=$('#startBtn');
    if(mode==='practice'){
      const n=selected.size;
      btn.textContent = n ? ('開始練習（'+n+' 個數字）') : '請先選數字';
      btn.disabled = (n===0); btn.style.opacity = n===0 ? .5 : 1;
    } else {
      btn.textContent='開始（60 秒）'; btn.disabled=false; btn.style.opacity=1;
    }
  }
  // ---- break-handling options (remembered between sessions) ----
  const OPTS='bb.opts';
  const loadOpts=()=>{ try{ return JSON.parse(localStorage.getItem(OPTS)||'{}'); }catch(e){ return {}; } };
  const saveOpts=()=>{ try{ localStorage.setItem(OPTS, JSON.stringify(
      {breakMode, idleSecs:idleMs/1000, hint:$('#hint').checked, mode})); }catch(e){} };

  function setBreak(b){
    breakMode = b;
    [...$('#breakModes').children].forEach(el=>el.classList.toggle('sel', el.dataset.b===b));
    $('#breakTip').textContent = b==='reset'
      ? '離開超過設定秒數就停錶；回來點一下燈直接繼續，平均從這裡重新算。'
      : '離開會跳出暫停畫面，按「繼續」倒數 3 秒再開始，那一題不列入平均。';
    saveOpts();
  }
  function setIdle(sec){
    idleMs = sec*1000;
    [...$('#idleOpts').children].forEach(el=>el.classList.toggle('sel', +el.dataset.s===sec));
    saveOpts();
  }
  $('#breakModes').addEventListener('click', e=>{ const b=e.target.dataset.b; if(b) setBreak(b); });
  $('#idleOpts').addEventListener('click',  e=>{ const s=e.target.dataset.s; if(s) setIdle(+s); });
  $('#hint').addEventListener('change', saveOpts);

  $('#modeRandom').addEventListener('click',()=>setMode('random'));
  $('#modePractice').addEventListener('click',()=>setMode('practice'));
  $('#stopBtn').addEventListener('click', endGame);
  $('#pauseBtn').addEventListener('click', ()=>pauseGame('manual'));
  $('#resumeBtn').addEventListener('click', resumeGame);
  $('#quitBtn').addEventListener('click', endGame);

  (function initOpts(){
    const o = loadOpts();
    setBreak(o.breakMode === 'pause' ? 'pause' : 'reset');
    setIdle([5,8,12].indexOf(o.idleSecs) >= 0 ? o.idleSecs : 8);
    if (typeof o.hint === 'boolean') $('#hint').checked = o.hint;
    setMode(o.mode === 'practice' ? 'practice' : 'random');
  })();
  updateStartBtn();

  $('#startBtn').addEventListener('click', startGame);
  $('#againBtn').addEventListener('click', ()=>{ $('#end').classList.add('hidden'); $('#start').classList.remove('hidden'); });

  // register an inline manifest so Android can install it (iOS uses the meta tags)
  try{
    const icon = 'data:image/svg+xml,' + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512"><rect width="512" height="512" rx="96" fill="#0f1319"/><g fill="#ffb020"><rect x="96" y="150" width="90" height="212" rx="20"/><rect x="326" y="150" width="90" height="212" rx="20"/></g><g fill="#2a323c"><rect x="211" y="150" width="90" height="212" rx="20"/></g></svg>');
    const man = {name:"二進位快打",short_name:"二進位快打",display:"standalone",orientation:"landscape",
      background_color:"#0f1319",theme_color:"#0f1319",start_url:".",
      icons:[{src:icon,sizes:"512x512",type:"image/svg+xml",purpose:"any maskable"}]};
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = URL.createObjectURL(new Blob([JSON.stringify(man)],{type:'application/manifest+json'}));
    document.head.appendChild(link);
  }catch(e){}
})();
</script>
</body>
</html>
